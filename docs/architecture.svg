<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" role="img" aria-label="Architecture of resample-optimism"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/></marker></defs><rect width="940" height="470" fill="#ffffff"/><text x="470.0" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b1f23">One scenario, three protocols, one untouched reference</text><rect x="24" y="52" width="170" height="50" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="109.0" y="72" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">seeded generator</text><text x="109.0" y="90" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">fixed seed, no network</text><rect x="24" y="126" width="170" height="50" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="109.0" y="146" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">stratified split</text><text x="109.0" y="164" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">disjoint by construction</text><line x1="109" y1="102" x2="109" y2="126" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="24" y="200" width="170" height="46" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="109.0" y="227.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">modelling pool</text><rect x="24" y="286" width="170" height="58" rx="6" fill="#f2fbf4" stroke="#116329" stroke-width="1.5"/><text x="109.0" y="306" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">honest holdout</text><text x="109.0" y="324" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">no resampler</text><text x="109.0" y="338" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">ever sees it</text><line x1="80" y1="176" x2="80" y2="200" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="140" y1="176" x2="140" y2="286" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="250" y="72" width="300" height="58" rx="6" fill="#fff5f4" stroke="#b42318" stroke-width="1.5"/><text x="400.0" y="92" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">leaked: resample, then cross-validate</text><text x="400.0" y="110" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">synthetic rows land in both folds</text><line x1="194" y1="223" x2="250" y2="101" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="250" y="150" width="300" height="58" rx="6" fill="#f2fbf4" stroke="#116329" stroke-width="1.5"/><text x="400.0" y="170" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">correct: resample inside each fold</text><text x="400.0" y="188" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">validation portion stays raw</text><line x1="194" y1="223" x2="250" y2="179" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="250" y="228" width="300" height="58" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="400.0" y="248" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">control: no resampling at all</text><text x="400.0" y="266" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">raw imbalanced pool</text><line x1="194" y1="223" x2="250" y2="257" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="600" y="82" width="150" height="38" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="675.0" y="105.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">cv estimate</text><line x1="550" y1="101" x2="600" y2="101" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="600" y="160" width="150" height="38" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="675.0" y="183.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">cv estimate</text><line x1="550" y1="179" x2="600" y2="179" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="600" y="238" width="150" height="38" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="675.0" y="261.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">cv estimate</text><line x1="550" y1="257" x2="600" y2="257" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="600" y="300" width="150" height="44" rx="6" fill="#f2fbf4" stroke="#116329" stroke-width="1.5"/><text x="675.0" y="326.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">holdout score</text><line x1="194" y1="315" x2="600" y2="322" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="4 3"/><line x1="550" y1="122" x2="598" y2="306" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="4 3"/><line x1="550" y1="200" x2="598" y2="306" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="4 3"/><line x1="550" y1="278" x2="598" y2="306" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="4 3"/><rect x="250" y="376" width="620" height="72" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="560.0" y="396" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">optimism = cv estimate - honest holdout score</text><text x="560.0" y="414" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">leaked and correct ship a byte-identical model, so the holdout column cannot tell them apart</text><text x="560.0" y="428" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">the fix moves the estimate, never the model</text><line x1="640" y1="344" x2="620" y2="376" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="760" y1="120" x2="836" y2="162" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="836" y1="162" x2="836" y2="376" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><text x="846" y="250" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#57606a">all three</text><text x="846" y="262" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#57606a">estimates</text><text x="222" y="207" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#57606a">same</text><text x="222" y="219" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#57606a">pool</text><text x="400" y="368" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#57606a">models scored on the untouched holdout</text></svg>
